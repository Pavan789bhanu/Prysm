name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pip-audit

      - name: Run pytest
        run: pytest -q
        env:
          SECRET_KEY: ci-test-secret-key-that-is-definitely-32-bytes

      - name: Funding demo smoke
        run: bash ../scripts/demo_smoke.sh
        env:
          SECRET_KEY: ci-test-secret-key-that-is-definitely-32-bytes
          DEMO_MODE: "true"

      - name: API e2e smoke
        run: |
          export SECRET_KEY=ci-test-secret-key-that-is-definitely-32-bytes
          export DEMO_MODE=true
          export FLASK_DEBUG=false
          python app.py &
          APP_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null; then
              break
            fi
            sleep 1
          done
          python ../scripts/api_e2e.py
          kill $APP_PID

      - name: Python dependency audit
        run: pip-audit -r requirements.txt || true
        # Informational for now — fail-closed once pins stabilize.

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: npm audit (high+)
        run: npm audit --audit-level=high || true
