services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      # Required for anything beyond local throwaway demos:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY before starting compose}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEMO_MODE: ${DEMO_MODE:-auto}
      FLASK_ENV: ${FLASK_ENV:-production}
      FLASK_DEBUG: "false"
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@prysm.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD (8+ chars) before starting compose}
      PRYSM_DATA_DIR: /var/lib/prysm
      REDIS_URL: ${REDIS_URL:-}
      JOB_BACKEND: ${JOB_BACKEND:-auto}
    volumes:
      - prysm_data:/var/lib/prysm
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    ports:
      - "6379:6379"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    profiles: ["redis"]
    command: ["python", "worker.py"]
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY before starting compose}
      DEMO_MODE: ${DEMO_MODE:-auto}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      REDIS_URL: redis://redis:6379/0
      JOB_BACKEND: rq
      PRYSM_DATA_DIR: /var/lib/prysm
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@prysm.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD (8+ chars) before starting compose}
    volumes:
      - prysm_data:/var/lib/prysm
    depends_on:
      - redis
      - backend

volumes:
  prysm_data:
